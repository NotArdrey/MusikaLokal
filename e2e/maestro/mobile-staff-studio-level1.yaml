      id: ${E2E_STAFF_STUDIO_CARD_ID}
    timeout: 120000
- assertVisible:
    id: ${E2E_STAFF_STUDIO_MANAGE_ID}
- assertVisible:
    id: ${E2E_STAFF_STUDIO_EDIT_ID}
- assertNotVisible:
    id: ${E2E_STAFF_STUDIO_DELETE_ID}
