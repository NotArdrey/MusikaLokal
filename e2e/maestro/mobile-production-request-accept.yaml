appId: ${APP_ID}
---
- openLink: "musikalokal://bookings"
- assertVisible:
    id: "mobile-bookings-page"
- tapOn:
    id: "mobile-bookings-tab-pending"
- scrollUntilVisible:
    element:
      id: ${E2E_PRODUCTION_REQUEST_CARD_ID}
    direction: DOWN
- assertVisible:
    id: ${E2E_PRODUCTION_REQUEST_CARD_ID}
- tapOn:
    id: ${E2E_PRODUCTION_REQUEST_ACCEPT_ID}
- tapOn:
    id: "custom-alert-button-accept"
