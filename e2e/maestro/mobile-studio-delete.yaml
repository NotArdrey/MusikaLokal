appId: ${APP_ID}
---
- openLink: "musikalokal://my_studio"
- scrollUntilVisible:
    element:
      id: ${E2E_STUDIO_CARD_ID}
    direction: DOWN
- assertVisible:
    id: ${E2E_STUDIO_CARD_ID}
- tapOn:
    id: ${E2E_STUDIO_DELETE_ID}
- tapOn:
    id: "app-modal-input"
- inputText: ${E2E_STUDIO_NAME}
- tapOn:
    id: "app-modal-confirm-button"
- tapOn:
    id: "app-modal-confirm-button"
    optional: true
