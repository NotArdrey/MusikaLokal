appId: ${APP_ID}
---
- openLink: "musikalokal://wallet"
- assertVisible:
    id: "mobile-wallet-page"
- tapOn:
    id: "mobile-wallet-open-withdraw-button"
- assertVisible:
    id: "mobile-wallet-withdraw-modal"
- tapOn:
    id: "mobile-wallet-add-payout-empty-button"
- assertVisible:
    id: "mobile-wallet-add-payout-modal"
- tapOn:
    id: "mobile-wallet-payout-type-gcash"
- tapOn:
    id: "mobile-wallet-account-name-input"
- inputText: ${E2E_PAYOUT_ACCOUNT_NAME}
- tapOn:
    id: "mobile-wallet-add-payout-submit-button"
- tapOn:
    id: "mobile-wallet-add-payout-submit-button"
    optional: true
