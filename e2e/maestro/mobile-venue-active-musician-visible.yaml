appId: ${APP_ID}
---
- openLink: "musikalokal://bookings"
- assertVisible:
    id: "mobile-bookings-page"
- assertVisible:
    id: "mobile-bookings-tab-active-musicians"
- tapOn:
    id: "mobile-bookings-tab-active-musicians"
- scrollUntilVisible:
    element:
      id: ${E2E_GIG_APPLICATION_CARD_ID}
    direction: DOWN
- assertVisible:
    id: ${E2E_GIG_APPLICATION_CARD_ID}
