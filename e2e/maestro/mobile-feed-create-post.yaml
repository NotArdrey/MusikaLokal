appId: ${APP_ID}
---
- openLink: "musikalokal://feed"
- extendedWaitUntil:
    visible:
      id: "mobile-feed-create-post-button"
    timeout: 120000
- tapOn:
    id: "mobile-feed-create-post-button"
- extendedWaitUntil:
    visible:
      id: "mobile-feed-create-post-input"
    timeout: 60000
- tapOn:
    id: "mobile-feed-create-post-input"
- inputText: ${E2E_POST_CONTENT}
- tapOn:
    id: "mobile-feed-post-submit-button"
- waitForAnimationToEnd:
    timeout: 5000
