appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 120000
- tapOn:
    id: "auth-email-input"
- inputText: ${E2E_MOBILE_EMAIL}
- hideKeyboard
- tapOn:
    id: "auth-password-input"
- inputText: ${E2E_MOBILE_PASSWORD}
- hideKeyboard
- tapOn:
    id: "auth-sign-in-button"
- extendedWaitUntil:
    visible:
      id: "nav-profile"
    timeout: 120000
