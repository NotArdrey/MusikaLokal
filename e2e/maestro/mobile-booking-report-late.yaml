appId: ${APP_ID}
---
- openLink: "musikalokal://bookings"
- assertVisible:
    id: "mobile-bookings-page"
- tapOn:
    id: "mobile-bookings-tab-upcoming"
- scrollUntilVisible:
    element:
      id: ${E2E_BOOKING_CARD_ID}
    direction: DOWN
- assertVisible:
    id: ${E2E_BOOKING_CARD_ID}
- tapOn:
    id: ${E2E_BOOKING_REPORT_LATE_ID}
- tapOn:
    id: "app-modal-input"
- inputText: ${E2E_BOOKING_LATE_REASON}
- tapOn:
    id: "app-modal-confirm-button"
- tapOn:
    id: "app-modal-confirm-button"
- tapOn:
    text: "OK"
    optional: true
