appId: ${APP_ID}
---
- openLink: "musikalokal://add_studio"
- assertVisible:
    id: "mobile-add-studio-page"
- tapOn:
    id: "mobile-add-studio-studio-name-input"
- inputText: ${E2E_STUDIO_NAME}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "mobile-add-studio-description-input"
    direction: DOWN
- tapOn:
    id: "mobile-add-studio-description-input"
- inputText: ${E2E_STUDIO_DESCRIPTION}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "mobile-add-studio-next-button"
    direction: DOWN
- tapOn:
    id: "mobile-add-studio-next-button"
- scrollUntilVisible:
    element:
      id: "mobile-add-studio-next-button"
    direction: DOWN
- tapOn:
    id: "mobile-add-studio-next-button"
- scrollUntilVisible:
    element:
      id: "mobile-add-studio-next-button"
    direction: DOWN
- tapOn:
    id: "mobile-add-studio-next-button"
- scrollUntilVisible:
    element:
      id: "mobile-add-studio-next-button"
    direction: DOWN
- tapOn:
    id: "mobile-add-studio-next-button"
- tapOn:
    id: "custom-alert-button-create"
