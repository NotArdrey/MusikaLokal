appId: ${APP_ID}
---
- launchApp
- extendedWaitUntil:
    visible:
      id: "auth-email-input"
    timeout: 120000
- tapOn:
    id: "auth-register-link"
- extendedWaitUntil:
    visible: "Create your account"
    timeout: 120000
- tapOn:
    id: ${E2E_SIGNUP_ROLE_ID}
- tapOn:
    id: "signup-email-input"
- inputText: ${E2E_SIGNUP_EMAIL}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "signup-password-input"
    direction: DOWN
    timeout: 60000
    speed: 80
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "signup-password-input"
- inputText: ${E2E_SIGNUP_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "signup-confirm-password-input"
    direction: DOWN
    timeout: 60000
    speed: 80
    visibilityPercentage: 100
    centerElement: true
- tapOn:
    id: "signup-confirm-password-input"
- inputText: ${E2E_SIGNUP_PASSWORD}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "signup-next-button"
    direction: DOWN
    timeout: 60000
    speed: 80
    visibilityPercentage: 100
    centerElement: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "signup-next-button"
    point: "50%,50%"
- tapOn:
    id: "signup-next-button"
    point: "50%,50%"
    optional: true
- extendedWaitUntil:
    visible:
      id: "signup-manual-review-page"
    timeout: 120000
- assertVisible: "Manual ID review"
