appId: ${APP_ID}
---
- openLink: "musikalokal://create_playlist"
- assertVisible:
    id: "mobile-create-playlist-page"
- tapOn:
    id: "mobile-playlist-title-input"
- inputText: ${E2E_PLAYLIST_TITLE}
- tapOn:
    id: "mobile-playlist-description-input"
- inputText: ${E2E_PLAYLIST_DESCRIPTION}
- tapOn:
    id: "mobile-playlist-genre-input"
- inputText: "OPM"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "mobile-playlist-add-track-button"
    direction: DOWN
- tapOn:
    id: "mobile-playlist-add-track-button"
- tapOn:
    id: "mobile-playlist-track-title-0"
- inputText: ${E2E_PLAYLIST_TRACK_TITLE}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "mobile-playlist-track-artist-0"
    direction: DOWN
- tapOn:
    id: "mobile-playlist-track-artist-0"
- inputText: "E2E Artist"
- hideKeyboard
- tapOn:
    id: "mobile-playlist-track-audio-0"
- scrollUntilVisible:
    element:
      id: "mobile-playlist-save-button"
    direction: DOWN
- tapOn:
    id: "mobile-playlist-save-button"
