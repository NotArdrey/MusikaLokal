appId: ${APP_ID}
---
- openLink: "musikalokal://edit_production?id=${E2E_PRODUCTION_ID}"
- assertVisible:
    id: "mobile-edit-production-page"
- tapOn:
    id: "mobile-edit-production-name-input"
- eraseText: 140
- inputText: ${E2E_PRODUCTION_UPDATED_NAME}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "mobile-edit-production-description-input"
    direction: DOWN
- tapOn:
    id: "mobile-edit-production-description-input"
- eraseText: 500
- inputText: ${E2E_PRODUCTION_UPDATED_DESCRIPTION}
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "mobile-edit-production-save-button"
    direction: DOWN
    timeout: 60000
    speed: 80
    visibilityPercentage: 50
    centerElement: true
- tapOn:
    id: "mobile-edit-production-save-button"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "mobile-edit-production-save-button"
- extendedWaitUntil:
    visible: "Production Team Updated"
    timeout: 60000
