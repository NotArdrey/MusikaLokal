appId: ${APP_ID}
---
- openLink: "musikalokal://bookings"
- assertVisible:
    id: "mobile-bookings-page"
- tapOn:
    id: ${E2E_BOOKING_TAB_ID}
- scrollUntilVisible:
    element:
      id: ${E2E_BOOKING_CARD_ID}
    direction: DOWN
- assertVisible:
    id: ${E2E_BOOKING_CARD_ID}
- tapOn:
    id: ${E2E_BOOKING_CANCEL_ID}
- tapOn:
    id: "app-modal-input"
- inputText: ${E2E_BOOKING_CANCEL_REASON}
- hideKeyboard
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "app-modal-confirm-button"
- tapOn:
    id: "app-modal-confirm-button"
    optional: true
