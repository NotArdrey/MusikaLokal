    visible:
      id: ${E2E_STAFF_GIG_CARD_ID}
    timeout: 120000
- assertVisible:
    id: ${E2E_STAFF_GIG_MANAGE_ID}
- assertNotVisible:
    id: ${E2E_STAFF_GIG_EDIT_ID}
- assertNotVisible:
    id: ${E2E_STAFF_GIG_DELETE_ID}
