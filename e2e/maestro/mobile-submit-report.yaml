appId: ${APP_ID}
---
- openLink: ${E2E_REPORT_ROUTE}
- assertVisible:
    id: ${E2E_REPORT_BUTTON_ID}
- tapOn:
    id: ${E2E_REPORT_BUTTON_ID}
- assertVisible:
    id: "report-modal"
- tapOn:
    id: "report-reason-spam-or-scam"
- tapOn:
    id: "report-submit-button"
- assertVisible:
    id: "report-done-button"
- tapOn:
    id: "report-done-button"
